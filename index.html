            html += '<tr><td style="font-family:monospace;color:#64748b;">[' + l.timestamp + ']</td><td><strong>' + escapeHtml(spk) + '</strong></td><td>' + escapeHtml(l.firstWords || '') + '</td></tr>';
          }
        });
        html += '</tbody></table></body></html>';
        const blob = new Blob([html], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'Transcription_Log_' + session.date + '.html';
        a.click();
      };

      window.saveJsonBackup = function() {
        const backup = {
          committee: { title: session.title, location: session.location, date: session.date, orientation: session.orientation },
          masterMembers,
          witnesses,
          seats,
          logs
        };
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = (session.title || 'Committee').replace(/[^a-z0-9]/gi, '_') + '_backup.json';
        a.click();
      };

      window.clearAllHearing = function() {
        if (!confirm('Start a fresh hearing? This will clear logs, unseat all members and witnesses, and reset turn counters.')) return;
        logs = [];
        liveEntry = null;
        activeSpeakerSeatId = null;
        hasStartedTurnOne = false;
        seats.forEach(s => {
          s.personId = null;
          s.personName = null;
          s.personTitle = '';
          s.personOrganization = '';
        });
        session.isStarted = false;
        session.isEnded = false;
        session.currentTurn = 1;
        session.turnElapsedSeconds = 0;
        session.isTimerRunning = false;
        try {
          localStorage.setItem('away_trip_logger_standalone_autosave', JSON.stringify({ savedAt: Date.now(), session, seats, masterMembers, committeeMemberIds, witnesses, logs, hasStartedTurnOne }));
        } catch (e) {}
        render();
      };

      // SETUP MODAL
      window.openSetup = function(tab = 'members') {
        setupTab = tab;
        setupModalOpen = true;
        renderModal();
      };

      window.closeSetup = function() {
        setupModalOpen = false;
        renderModal();
        render();
      };

      window.addMasterMember = function() {
        const inp = document.getElementById('new-mp-name');
        if (!inp || !inp.value.trim()) return;
        const newM = { id: 'm-' + Date.now(), name: inp.value.trim() };
        masterMembers.push(newM);
        masterMembers = sortMpsBySurname(masterMembers);
        committeeMemberIds.push(newM.id);
        inp.value = '';
        renderModal();
      };

      window.deleteMasterMember = function(id) {
        const target = masterMembers.find(m => m.id === id);
        if (!confirm('Are you sure you want to delete ' + (target ? target.name : 'this MP') + ' from the pool?')) return;
        masterMembers = masterMembers.filter(m => m.id !== id);
        committeeMemberIds = committeeMemberIds.filter(c => c !== id);
        seats.forEach(s => { if (s.personId === id) { s.personId = null; s.personName = null; } });
        renderModal();
      };

      window.toggleCommitteeMember = function(id) {
        if (committeeMemberIds.includes(id)) {
          committeeMemberIds = committeeMemberIds.filter(c => c !== id);
          seats.forEach(s => { if (s.personId === id) { s.personId = null; s.personName = null; } });
        } else {
          committeeMemberIds.push(id);
        }
        renderModal();
      };

      window.addWitness = function() {
        const nameInp = document.getElementById('wit-name');
        const titleInp = document.getElementById('wit-title');
        const orgInp = document.getElementById('wit-org');
        if (!nameInp || !nameInp.value.trim()) return;
        witnesses.push({
          id: 'w-' + Date.now(),
          name: nameInp.value.trim(),
          title: titleInp ? titleInp.value.trim() : '',
          organization: orgInp ? orgInp.value.trim() : ''
        });
        nameInp.value = '';
        if (titleInp) titleInp.value = '';
        if (orgInp) orgInp.value = '';
        renderModal();
      };

      window.deleteWitness = function(id) {
        const target = witnesses.find(w => w.id === id);
        if (!confirm('Are you sure you want to delete ' + (target ? target.name : 'this witness') + '?')) return;
        witnesses = witnesses.filter(w => w.id !== id);
        seats.forEach(s => { if (s.personId === id) { s.personId = null; s.personName = null; } });
        renderModal();
      };

      window.assignSeat = function(seatId, personId) {
        const seat = seats.find(s => s.id === seatId);
        if (!seat) return;
        if (!personId) {
          seat.personId = null;
          seat.personName = null;
        } else {
          // Unseat personId from any other seat to prevent duplicates
          seats.forEach(s => {
            if (s.id !== seatId && s.personId === personId) {
              s.personId = null;
              s.personName = null;
              s.personTitle = '';
              s.personOrganization = '';
            }
          });

          if (seat.type === 'member') {
            const m = masterMembers.find(mem => mem.id === personId);
            seat.personId = personId;
            seat.personName = m ? m.name : null;
          } else {
            const w = witnesses.find(wit => wit.id === personId);
            seat.personId = personId;
            seat.personName = w ? w.name : null;
            seat.personTitle = w ? w.title : '';
            seat.personOrganization = w ? w.organization : '';
          }
        }
        renderModal();
      };

      window.editLog = function(logId) {
        const log = logs.find(l => l.id === logId);
        if (!log) return;
        const currentTitle = log.type === 'turn' ? 'TURN ' + log.turnNumber : (log.speakerName || 'Entry');
        const newWords = prompt('Edit words / remarks for ' + currentTitle + ' [' + log.timestamp + ']:', log.firstWords);
        if (newWords !== null) {
          log.firstWords = newWords.trim();
          render();
        }
      };

      window.toggleChairRole = function(seatId) {
        const seat = seats.find(s => s.id === seatId);
        if (!seat || !seat.isChairSeat) return;
        seat.chairRole = seat.chairRole === 'Presiding Member' ? 'Chair' : 'Presiding Member';
        renderModal();
      };

      function focusInput() {
        setTimeout(() => {
          const el = document.getElementById('live-input');
          if (el) el.focus();
        }, 50);
      }

      function renderSeat(s, extra) {
        if (!s) return '';
        const occ = Boolean(s.personName);
        const chair = s.isChairSeat;
        const mp = s.type === 'member';
        const active = s.id === activeSpeakerSeatId;

        let cls = 'relative flex flex-col items-center justify-center p-2 rounded-lg text-center cursor-pointer select-none border transition-all ';
        if (active) {
          cls += 'bg-emerald-950/80 border-emerald-400 ring-2 ring-emerald-400 text-white shadow-lg ';
        } else if (occ) {
          if (chair) cls += 'bg-gradient-to-b from-blue-950 to-indigo-950 border-amber-400 text-blue-50 shadow-md ring-1 ring-amber-500/40 ';
          else if (mp) cls += 'bg-blue-950/80 hover:bg-blue-900 border-blue-500/80 text-blue-50 ';
          else cls += 'bg-emerald-950/80 hover:bg-emerald-900 border-emerald-500/80 text-emerald-50 ';
        } else {
          cls += 'bg-slate-900/40 hover:bg-slate-850 border-dashed border-slate-700 text-slate-400 ';
        }

        return '<button onclick="seatClick(\\'' + s.id + '\\')" class="' + cls + ' ' + (extra || '') + '">'
          + (active ? '<span class="absolute -top-2.5 px-2 py-0.5 bg-emerald-400 text-slate-950 font-black text-[9px] uppercase tracking-wider rounded shadow-sm">LIVE</span>' : '')
          + '<div class="text-[10px] font-bold uppercase tracking-wider mb-0.5 ' + (chair ? 'text-amber-300' : (mp ? 'text-blue-300' : 'text-emerald-300')) + '">'
          + (chair ? '👑 ' + (s.chairRole || 'Chair') + ' [' + (s.chairRole === 'Presiding Member' ? 'UPM' : 'UCP') + ']' : (mp ? '🏛️ MP' : '🎙️ Witness'))
          + '<div class="text-xs md:text-sm font-bold text-white break-words whitespace-normal leading-tight text-center w-full">' + (occ ? escapeHtml(s.personName) : s.label) + '</div>'
          + '</button>';
      }

              }).join('')

        } else if (setupTab === 'details') {
